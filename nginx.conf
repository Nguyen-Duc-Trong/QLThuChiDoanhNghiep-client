server {
    listen 80;
    server_name localhost;

    # Phục vụ file build React (Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Hỗ trợ Client-side Routing trong React (tránh 404 khi F5 trang)
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request API sang backend container
    location /api/ {
        proxy_pass http://server:3000;  # giữ nguyên /api vì server có setGlobalPrefix("api")
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
